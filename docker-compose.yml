services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       vendorrecon
      POSTGRES_USER:     vendorrecon
      POSTGRES_PASSWORD: changeme
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendorrecon"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file: ./backend/.env
    ports: ["8000:8000"]
    volumes: ["./backend:/app"]
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: ./backend
    command: arq app.workers.tasks.WorkerSettings
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]

volumes:
  pgdata:
